name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, test, build, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — `packageManager` in package.json is the
      # single source of truth, and specifying both is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Validate with the same canonical validator OpenWork installs with, from
      # the OpenWork checkout, so a manifest that passes here is one the host
      # will accept. A separate validator would drift, and a drifted validator
      # is how an app ships asking for something the review screen never showed.
      - name: Check out OpenWork for the app tools
        uses: actions/checkout@v4
        with:
          repository: different-ai/openwork
          ref: dev
          path: .openwork
          sparse-checkout: |
            packages/app-contract
            packages/app-tools

      # The app tools have not landed on OpenWork `dev` yet — they are in
      # different-ai/openwork#3303. Until that merges this step reports that it
      # cannot run, loudly and by name, rather than failing opaquely or passing
      # while having validated nothing.
      - name: Validate and package
        run: |
          TOOLS=.openwork/packages/app-tools/bin/openwork-app.mjs
          if [ ! -f "$TOOLS" ]; then
            echo "::warning title=Packaging skipped::The OpenWork app tools are not on dev yet (different-ai/openwork#3303). Station's own typecheck, tests, and build ran; the manifest was NOT validated and no package was produced."
            exit 0
          fi
          cd .openwork
          pnpm install --filter @openwork/app-contract --filter @openwork/app-tools
          pnpm --filter @openwork/app-contract build
          pnpm --filter @openwork/app-tools build
          cd ..
          node scripts/package.mjs --tools "$TOOLS"

      - uses: actions/upload-artifact@v4
        if: hashFiles('release/*.owapp') != ''
        with:
          name: openwork-station-package
          path: release/
